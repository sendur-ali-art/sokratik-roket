<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Öğretmen Paneli - Laboratuvar İzleme</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background-color: #f1f2f6; display: flex; height: 100vh; }
        
        /* Sol Panel - Tablo */
        #list-panel { width: 50%; padding: 20px; background: white; border-right: 2px solid #dcdde1; overflow-y: auto; }
        h2 { color: #2c3e50; margin-top: 0; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #dcdde1; }
        th { background-color: #34495e; color: white; }
        tr:hover { background-color: #f5f6fa; cursor: pointer; }
        .selected-row { background-color: #e8f6f3 !important; border-left: 4px solid #3498db; }
        
        /* Sağ Panel - Canlı Sohbet */
        #chat-panel { width: 50%; display: flex; flex-direction: column; background: #2f3640; color: white; }
        #chat-header { padding: 20px; background: #34495e; font-size: 18px; font-weight: bold; border-bottom: 2px solid #f1c40f; }
        #chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        
        .msg { padding: 10px 15px; border-radius: 8px; font-size: 14px; max-width: 80%; line-height: 1.4; }
        .msg-student { background: #0097e6; align-self: flex-end; border-bottom-right-radius: 0; }
        .msg-ai { background: #dcdde1; color: #2f3640; align-self: flex-start; border-bottom-left-radius: 0; }
        .msg-time { display: block; font-size: 10px; opacity: 0.7; margin-top: 5px; }
        
        .empty-state { text-align: center; color: #7f8c8d; margin-top: 50%; font-style: italic; }
    </style>
</head>
<body>

    <div id="list-panel">
        <h2>🧑‍🏫 Laboratuvar Canlı Takip Paneli</h2>
        <table>
            <thead>
                <tr>
                    <th>Öğrenci Adı</th>
                    <th>Durum / Alarm</th>
                    <th>Atış</th>
                    <th>Bulunan</th>
                </tr>
            </thead>
            <tbody id="student-table-body">
                </tbody>
        </table>
    </div>

    <div id="chat-panel">
        <div id="chat-header">Canlı Ekran İzleme: <span id="active-student-name" style="color:#f1c40f;">Seçim Yapılmadı</span></div>
        <div id="chat-box">
            <div class="empty-state">Canlı sohbet geçmişini görmek için soldaki tablodan bir öğrenciye tıklayın.</div>
        </div>
    </div>

    <script>
        const socket = io();
        let studentsData = {};
        let activeStudentId = null;

        // Tüm liste güncellendiğinde
        socket.on('teacher_update_all', (studentsArray) => {
            studentsData = {};
            studentsArray.forEach(s => studentsData[s.id] = s);
            renderTable();
        });

        // Tek bir öğrencinin durumu değiştiğinde (Hafiye Raporu)
        socket.on('teacher_update_student', (student) => {
            studentsData[student.id] = student;
            renderTable();
        });

        // Canlı Chat akışı
        socket.on('teacher_chat_update', (data) => {
            // Sadece seçili öğrenciyse chat ekranını güncelle
            if (activeStudentId === data.id) {
                appendMessage(data.msg);
            }
        });

        function renderTable() {
            const tbody = document.getElementById('student-table-body');
            tbody.innerHTML = '';
            
            Object.values(studentsData).forEach(s => {
                const tr = document.createElement('tr');
                if(s.id === activeStudentId) tr.className = 'selected-row';
                
                tr.onclick = () => selectStudent(s.id);
                
                tr.innerHTML = `
                    <td style="font-weight:bold;">${s.name}</td>
                    <td style="font-weight:bold;">${s.status}</td>
                    <td>${s.shots} Roket</td>
                    <td>${s.foundVars} / 2</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function selectStudent(id) {
            activeStudentId = id;
            const student = studentsData[id];
            document.getElementById('active-student-name').innerText = student.name;
            renderTable(); // Seçili satırı boyamak için
            
            // Sohbet kutusunu temizle ve geçmişi yükle
            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML = '';
            
            if (student.chat && student.chat.length > 0) {
                student.chat.forEach(msg => appendMessage(msg));
            } else {
                chatBox.innerHTML = '<div class="empty-state">Henüz bir sohbet geçmişi yok.</div>';
            }
        }

        function appendMessage(msgObj) {
            const chatBox = document.getElementById('chat-box');
            // Empty state'i kaldır
            if(chatBox.querySelector('.empty-state')) chatBox.innerHTML = '';

            const div = document.createElement('div');
            const isStudent = msgObj.sender !== "Asistan";
            div.className = isStudent ? 'msg msg-student' : 'msg msg-ai';
            
            div.innerHTML = `
                <b>${msgObj.sender}</b><br>
                ${msgObj.text}
                <span class="msg-time">${msgObj.time}</span>
            `;
            
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
